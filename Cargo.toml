[package]
name = "lanshare"
version = "1.2.0"
edition = "2021"
authors = ["Jokke Heikkilä"]
description = "Zero-config LAN folder sharing GUI and TUI powered by Share-Ring"
license = "MIT"
repository = "https://github.com/jokkeheikkila/LanShare"
homepage = "https://github.com/jokkeheikkila/LanShare"
readme = "README.md"
keywords = ["lan", "file-sharing", "p2p", "tls", "tui"]
categories = ["network-programming", "command-line-utilities", "gui"]
default-run = "lanshare-cli"

[lib]
name = "lanshare"
path = "src/lib.rs"

[[bin]]
name = "lanshare-cli"
path = "src/main.rs"

[[bin]]
name = "lanshare-gui"
path = "src/bin/lanshare-gui.rs"

[dependencies]
# GUI Framework (use `eframe::egui` rather than duplicating direct `egui`)
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow"] }

# Native Dialogs & Clipboard
rfd = "0.17"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png"] }

# Async & Networking (explicitly disable tokio-rustls default `aws_lc_rs` so only `ring` is compiled)
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "fs", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

# Data Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities & Terminal UI
local-ip-address = "0.6"
walkdir = "2.5"
unicode-width = "0.2"
libc = "0.2"
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "x11", "wayland"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
