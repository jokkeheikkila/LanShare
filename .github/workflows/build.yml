name: Build & Release (Windows & Linux)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.rel.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Create or update GitHub Release entry
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            if ! gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release create "${TAG_NAME}" \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "LanShare ${TAG_NAME}" \
                --generate-notes
            fi
          else
            TAG_NAME="latest"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f latest "${GITHUB_SHA}"
            git push -f origin refs/tags/latest

            NOTES="Automated portable release build from commit \`${SHORT_SHA}\`.

          ### Included Standalone Binaries (Zero Installation Required)
          - **Windows 10/11 (64-bit)**:
            - \`lanshare-gui-windows-x64.exe\` — Native Desktop GUI
            - \`lanshare-cli-windows-x64.exe\` — Interactive Terminal UI (TUI) & Direct CLI
          - **Linux (64-bit)**:
            - \`lanshare-gui-linux-x64\` — Native Desktop GUI (X11 & Wayland)
            - \`lanshare-cli-linux-x64\` — Interactive Terminal UI (TUI) & Direct CLI"

            if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release edit latest \
                --repo "${GITHUB_REPOSITORY}" \
                --title "LanShare — Latest Build (${SHORT_SHA})" \
                --notes "${NOTES}"
            else
              gh release create latest \
                --repo "${GITHUB_REPOSITORY}" \
                --target "${GITHUB_SHA}" \
                --title "LanShare — Latest Build (${SHORT_SHA})" \
                --notes "${NOTES}"
            fi
          fi

          echo "release_tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

  build-windows:
    name: Build Windows (x86_64)
    needs: prepare-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check, Test, Build & Upload Windows Binaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings -W clippy::undocumented_unsafe_blocks
          cargo test --locked
          cargo build --release --locked

          cp target/release/lanshare-gui.exe lanshare-gui-windows-x64.exe
          cp target/release/lanshare-cli.exe lanshare-cli-windows-x64.exe

          gh release upload "${RELEASE_TAG}" \
            lanshare-gui-windows-x64.exe \
            lanshare-cli-windows-x64.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build-linux:
    name: Build Linux (x86_64)
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Deps, Check, Test, Build & Upload Linux Binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Updating apt and installing dependencies..."
            if sudo apt-get update -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends --fix-missing \
                 -o Acquire::Retries=3 \
                 build-essential \
                 pkg-config \
                 libxkbcommon-dev \
                 libwayland-dev \
                 libx11-dev \
                 libxcursor-dev \
                 libxi-dev \
                 libxrandr-dev \
                 libxinerama-dev \
                 libgl1-mesa-dev \
                 libegl1-mesa-dev; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Failed to install dependencies after 3 attempts."
              exit 1
            fi
            sleep 10
          done

          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings -W clippy::undocumented_unsafe_blocks
          cargo test --locked
          cargo build --release --locked

          cp target/release/lanshare-gui lanshare-gui-linux-x64
          cp target/release/lanshare-cli lanshare-cli-linux-x64
          chmod +x lanshare-gui-linux-x64 lanshare-cli-linux-x64

          gh release upload "${RELEASE_TAG}" \
            lanshare-gui-linux-x64 \
            lanshare-cli-linux-x64 \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
