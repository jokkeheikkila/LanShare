name: Build & Release (Windows & Linux)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    name: Prepare GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.rel.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure GitHub Release entry exists for version tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if ! gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "LanShare ${TAG_NAME}" \
              --generate-notes
          fi

          echo "release_tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"

  build-windows:
    name: Build Windows (x86_64)
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check, Test, and Build Windows Binaries
        shell: bash
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings -W clippy::undocumented_unsafe_blocks
          cargo test --locked
          cargo build --release --locked

          cp target/release/lanshare-gui.exe lanshare-gui-windows-x64.exe
          cp target/release/lanshare-cli.exe lanshare-cli-windows-x64.exe

      - name: Upload Windows Release Binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            lanshare-gui-windows-x64.exe \
            lanshare-cli-windows-x64.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build-linux:
    name: Build Linux (x86_64)
    needs: prepare-release
    if: ${{ !cancelled() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install Deps, Check, Test, and Build Linux Binaries
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Updating apt and installing dependencies..."
            if sudo apt-get update -o Acquire::Retries=3 && \
               sudo apt-get install -y --no-install-recommends --fix-missing \
                 -o Acquire::Retries=3 \
                 build-essential \
                 pkg-config \
                 libxkbcommon-dev \
                 libwayland-dev \
                 libx11-dev \
                 libxcursor-dev \
                 libxi-dev \
                 libxrandr-dev \
                 libxinerama-dev \
                 libgl1-mesa-dev \
                 libegl1-mesa-dev; then
              break
            fi
            if [ "$i" -eq 3 ]; then
              echo "Failed to install dependencies after 3 attempts."
              exit 1
            fi
            sleep 10
          done

          rustup default stable
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings -W clippy::undocumented_unsafe_blocks
          cargo test --locked
          cargo build --release --locked

          cp target/release/lanshare-gui lanshare-gui-linux-x64
          cp target/release/lanshare-cli lanshare-cli-linux-x64
          chmod +x lanshare-gui-linux-x64 lanshare-cli-linux-x64

      - name: Upload Linux Release Binaries
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            lanshare-gui-linux-x64 \
            lanshare-cli-linux-x64 \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
